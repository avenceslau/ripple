name: CI

on:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build.rs compiles the bundled tsgo; without Go the tsgo tests silently skip.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      # Stands in for publish-time verification, which the release job skips so
      # third-party build code never runs next to the publishing credentials.
      - id: package
        run: |
          cargo package --locked

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          crate="target/package/monoripple-$version.crate"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

          {
            echo "### monoripple $version ($(du -h "$crate" | cut -f1) compressed)"
            echo
            echo '```'
            tar -tzf "$crate"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.crate }}
          archive: false
          retention-days: 14

      # Same settings as [package.metadata.docs.rs].
      - run: cargo doc --locked --no-deps --no-default-features

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: target/doc
          retention-days: 14
